version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service (Optional if using Supabase)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: purvaj_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-purvaj_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PurvajSecurePass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-purvaj_wholesale}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-purvaj_admin} -d ${POSTGRES_DB:-purvaj_wholesale}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - purvaj_net

  # -------------------------------------------------------------
  # Express.js Backend API Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: purvaj_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-postgresql://purvaj_admin:PurvajSecurePass2026!@postgres:5432/purvaj_wholesale}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 500
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "5000"
    networks:
      - purvaj_net

  # -------------------------------------------------------------
  # React + Vite Frontend Service
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: purvaj_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - purvaj_net

  # -------------------------------------------------------------
  # Nginx Reverse Proxy & TLS Termination
  # -------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: purvaj_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment to mount SSL certificates:
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - purvaj_net

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  purvaj_net:
    driver: bridge
